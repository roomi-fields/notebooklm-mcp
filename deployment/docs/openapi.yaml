openapi: 3.1.0
info:
  title: NotebookLM REST API
  version: 4.6.0
  description: |
    Local HTTP REST API for Google NotebookLM. Citation-backed Q&A, Studio
    content generation (audio, video, infographic, report, presentation,
    data table), notebook library management, multi-account auto-reauth.

    Companion to the MCP server in the same package
    (`@roomi-fields/notebooklm-mcp`). See
    https://notebooklm.roomi-fields.com/ for the full guide.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Romain Peyrichou
    url: https://github.com/roomi-fields/notebooklm-mcp

servers:
  - url: http://localhost:3000
    description: Local server (default)
  - url: http://{host}:{port}
    description: Custom host
    variables:
      host:
        default: localhost
      port:
        default: '3000'

# Required once the server runs with NOTEBOOKLM_API_KEY (mandatory for any
# bind wider than loopback). /health is the only route that answers without it,
# and then returns liveness only. See GHSA-p69m-c5rf-g2c3.
security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Q&A
  - name: Notebooks
  - name: Sources
  - name: Content
  - name: Sessions

paths:
  /:
    get:
      operationId: get_server_info
      tags: [Health]
      summary: Server identity, version, and a pointer to the docs
      responses:
        '200':
          description: 'Server descriptor'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  /health:
    get:
      operationId: get_health
      tags: [Health]
      summary: Server health check
      responses:
        '200':
          description: 'Server status, uptime, active sessions'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetHealthResponse' }

  /utcp:
    get:
      operationId: get_utcp_manual
      tags: [Health]
      summary: UTCP tool manual for this server
      description: |
        The manual a Universal Tool Calling Protocol client reads before
        calling anything. UTCP has no protocol server: the client reads this
        once and then calls the routes below natively, so the manual is a
        description of this same API rather than a second way into it.

        Generated from this specification, with the call addresses rebased on
        the address the request arrived at. The same document is published
        statically at `/utcp.json` on the documentation site. Behind the token
        guard like every route but `/health`.
      responses:
        '200':
          description: 'A UTCP manual — `utcp_version`, `manual_version`, `tools`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UtcpManual' }

  /setup-auth:
    post:
      operationId: setup_auth
      tags: [Auth]
      summary: First-time Google authentication (opens visible browser)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                show_browser: { type: boolean, default: true }
                account: { type: string }
      responses:
        '200':
          description: 'Auth completed'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupAuthResponse' }

  /de-auth:
    post:
      operationId: de_auth
      tags: [Auth]
      summary: Logout, clear all credentials
      responses:
        '200':
          description: 'Logged out'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeAuthResponse' }

  /re-auth:
    post:
      operationId: re_auth
      tags: [Auth]
      summary: Re-authenticate or switch account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account: { type: string }
      responses:
        '200':
          description: 'Re-authenticated'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReAuthResponse' }

  /ask:
    post:
      operationId: ask_question
      tags: [Q&A]
      summary: Ask a question with citation-backed response
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '200':
          description: 'Answer with citations'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskQuestionResponse' }
        '400':
          description: Missing question
        '500':
          description: Server error

  /notebooks:
    get:
      operationId: list_notebooks
      tags: [Notebooks]
      summary: List all notebooks in the local library
      responses:
        '200':
          description: 'Notebook list'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListNotebooksResponse' }
    post:
      operationId: add_notebook
      tags: [Notebooks]
      summary: Manually add a notebook to the library
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, name, url]
              properties:
                id: { type: string }
                name: { type: string }
                url: { type: string }
                description: { type: string }
                topics: { type: array, items: { type: string } }
      responses:
        '200':
          description: 'Notebook added'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddNotebookResponse' }

  /notebooks/scrape:
    get:
      operationId: list_notebooks_from_nblm
      tags: [Notebooks]
      summary: Scrape all notebooks from NotebookLM UI
      responses:
        '200':
          description: 'Live notebook list with ids and names'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListNotebooksFromNblmResponse' }

  /notebooks/import-from-scrape:
    post:
      operationId: import_scraped_notebooks
      tags: [Notebooks]
      summary: Bulk import scraped notebooks into local library
      responses:
        '200':
          description: 'Import summary'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportScrapedNotebooksResponse' }

  /notebooks/auto-discover:
    post:
      operationId: auto_discover_notebook
      tags: [Notebooks]
      summary: Generate notebook metadata autonomously via NotebookLM queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
      responses:
        '200':
          description: 'Generated metadata'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoDiscoverNotebookResponse' }

  /notebooks/search:
    get:
      operationId: search_notebooks
      tags: [Notebooks]
      summary: Search the local library by keyword
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Matching notebooks'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchNotebooksResponse' }

  /notebooks/stats:
    get:
      operationId: get_library_stats
      tags: [Notebooks]
      summary: Library statistics
      responses:
        '200':
          description: 'Counts and aggregates'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetLibraryStatsResponse' }

  /notebooks/bulk-delete:
    delete:
      operationId: delete_notebooks_from_nblm
      tags: [Notebooks]
      summary: Delete multiple notebooks at once
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: 'Deletion summary'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteNotebooksFromNblmResponse' }

  /notebooks/{id}:
    get:
      operationId: get_notebook
      tags: [Notebooks]
      summary: Get notebook details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Notebook details'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetNotebookResponse' }
    put:
      operationId: update_notebook
      tags: [Notebooks]
      summary: Update notebook metadata
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Updated'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateNotebookResponse' }
    delete:
      operationId: remove_notebook
      tags: [Notebooks]
      summary: Delete a notebook from the library
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoveNotebookResponse' }

  /notebooks/{id}/activate:
    put:
      operationId: select_notebook
      tags: [Notebooks]
      summary: Set notebook as the default active notebook
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Activated'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectNotebookResponse' }

  /notebooks/create:
    post:
      operationId: create_notebook
      tags: [Notebooks]
      summary: Create a new notebook in NotebookLM
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: 'Created notebook'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateNotebookResponse' }

  /sessions:
    get:
      operationId: list_sessions
      tags: [Sessions]
      summary: List active sessions
      responses:
        '200':
          description: 'Active sessions'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSessionsResponse' }

  /sessions/{id}:
    delete:
      operationId: close_session
      tags: [Sessions]
      summary: Close a session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Closed'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseSessionResponse' }

  /sessions/{id}/reset:
    post:
      operationId: reset_session
      tags: [Sessions]
      summary: Reset a session's history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetSessionResponse' }

  /content/sources:
    post:
      operationId: add_source
      tags: [Sources]
      summary: Add a source (file, url, text, youtube, drive) to the active notebook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddSourceRequest' }
      responses:
        '200':
          description: 'Source added'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddSourceResponse' }
    delete:
      operationId: delete_source
      tags: [Sources]
      summary: Delete source by name (query parameter)
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteSourceResponse' }

  /content/sources/{id}:
    delete:
      operationId: delete_source_by_id
      tags: [Sources]
      summary: Delete source by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteSourceByIdResponse' }

  /content/{contentId}:
    delete:
      operationId: delete_content
      tags: [Content]
      summary: Delete a generated Studio artifact
      description: |
        RPC-backed (no browser). Irreversible. Note-backed mind maps are not
        covered — they live in the notes system, not the Studio library.
      parameters:
        - in: path
          name: contentId
          required: true
          schema: { type: string }
        - in: query
          name: notebook_url
          required: false
          schema: { type: string }
        - in: query
          name: notebook_id
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 'Deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteContentResponse' }

  /notebooks/{id}/sources:
    get:
      operationId: list_sources
      tags: [Sources]
      summary: List a notebook's sources with their ids and titles
      description: |
        RPC-backed (no browser). Returns `{ notebookId, count, sources: [{ id, title }] }`.
        This is where the source ids for `/notebooks/{id}/sources/{sourceId}` come from.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Source list'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSourcesResponse' }

  /notebooks/{id}/sources/{sourceId}:
    get:
      operationId: read_source
      tags: [Sources]
      summary: Read a source's indexed text, one page at a time
      description: |
        RPC-backed (no browser). Returns the exact content NotebookLM reasons
        over. Sources are long — the first PDF measured ran to 157,716
        characters — so the response is paginated by default and carries
        `totalChars`, `pageChars`, `offset`, `hasMore`, `nextCursor` and a
        plain-language `continue` instruction. Pages are cut at the nearest
        line break (tag close, in HTML), and concatenating every page
        reproduces the document exactly. Pass `paginate=false` for the whole
        document in one response. The `html` rendition preserves structure but
        inlines images as base64 and is bigger.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: sourceId
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [text, html], default: text }
        - in: query
          name: paginate
          required: false
          description: Set to `false` to return the whole document in one response.
          schema: { type: boolean, default: true }
        - in: query
          name: max_chars
          required: false
          description: Page size in characters. Ignored when `paginate=false`.
          schema: { type: integer, default: 20000, minimum: 1 }
        - in: query
          name: cursor
          required: false
          description: Resume point — the `nextCursor` returned by the previous page.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: "One page of the source's content, plus how to fetch the rest"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadSourceResponse' }

    patch:
      operationId: rename_source
      tags: [Sources]
      summary: Rename one source in place
      description: RPC-backed (no browser). An empty `title` is a 400.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: sourceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
              required: [title]
      responses:
        '200':
          description: "The source's new title"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenameSourceResponse' }
        '400': { description: Missing or empty title }

  /notebooks/{id}/sources/{sourceId}/guide:
    get:
      operationId: get_source_guide
      tags: [Sources]
      summary: NotebookLM's own summary and key topics for one source
      description: |
        RPC-backed (no browser). A source NotebookLM has not summarised yet
        returns an empty `summary` and no topics.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: sourceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Summary and key topics'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetSourceGuideResponse' }

  /notebooks/{id}/search:
    post:
      operationId: search_passages
      tags: [Notebooks]
      summary: Ranked passages from the notebook's index, without generating an answer
      description: |
        RPC-backed (no browser). Retrieval rather than question answering:
        nothing is generated and no generation quota is spent. Rank is global
        across sources and lower is better. `start` / `end` are character
        offsets into the source's full text, and are `null` when the server
        did not give them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                source_ids:
                  type: array
                  items: { type: string }
                  description: Restrict to these source UUIDs. Omit to search them all.
                source_names:
                  type: array
                  items: { type: string }
                  description: Restrict by source title; an ambiguous title is an error.
                limit:
                  type: number
                  description: Keep at most this many passages, best rank first.
      responses:
        '200':
          description: 'Ranked passages'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPassagesResponse' }

  /notebooks/{id}/summary:
    get:
      operationId: get_notebook_summary
      tags: [Notebooks]
      summary: A notebook's own summary of its sources, and the questions it suggests
      description: |
        RPC-backed (no browser). Cheaper than asking a question to find out
        what a notebook holds.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Summary and suggested topics'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetNotebookSummaryResponse' }

  /notebooks/{id}/freshness:
    get:
      operationId: check_source_freshness
      tags: [Sources]
      summary: Have the notebook's URL / Drive sources drifted?
      description: |
        RPC-backed (no browser). Checks every source unless `source_id`
        narrows it. `stale: null` means the server did not answer for that
        source — not that it is current.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: source_id
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 'Per-source freshness'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckSourceFreshnessResponse' }

  /notebooks/{id}/chat:
    get:
      operationId: get_chat_history
      tags: [Notebooks]
      summary: Read back the recorded questions and answers, newest first
      description: |
        RPC-backed (no browser). NotebookLM exposes only the most recent
        conversation per notebook; older ones cannot be listed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: conversation_id
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
      responses:
        '200':
          description: 'Conversation turns'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetChatHistoryResponse' }
    delete:
      operationId: delete_chat_history
      tags: [Notebooks]
      summary: Clear the chat history
      description: |
        The web UI's "Delete history". NotebookLM has no per-turn delete, so
        the whole conversation goes. Nothing to delete is reported as
        `deleted: false`, not as a failure.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: conversation_id
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 'What was deleted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteChatHistoryResponse' }

  /notebooks/{id}/share:
    get:
      operationId: get_share_status
      tags: [Notebooks]
      summary: Read a notebook's sharing status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Sharing status'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetShareStatusResponse' }
    put:
      operationId: share_notebook
      tags: [Notebooks]
      summary: Toggle the public link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public: { type: boolean }
              required: [public]
      responses:
        '200':
          description: 'Sharing status after the change'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareNotebookResponse' }

  /content/{artifactId}/retry:
    post:
      operationId: retry_content
      tags: [Content]
      summary: Retry a failed generation, keeping the same artifact id
      description: |
        RPC-backed. The artifact is not deleted and not replaced: the same id
        goes back to `generating`, so a reference the caller already holds
        stays valid. Deleting and regenerating instead mints a new id.

        A refusal (rate limit, quota, or an artifact the backend will not
        retry) comes back as an error. An accepted retry can still fail again
        on Google's side — poll `GET /content` for the outcome.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
      responses:
        '200':
          description: 'Retry queued, with the unchanged id and new status'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetryContentResponse' }

  /content/{artifactId}/export:
    post:
      operationId: export_artifact
      tags: [Content]
      summary: Export a finished artifact to Google Docs or Sheets
      description: |
        RPC-backed. `documentUrl` is `null` when the reply carried no Drive
        link — the export may still have succeeded; check Drive.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                target: { type: string, enum: [docs, sheets], default: docs }
                title: { type: string, default: Export }
      responses:
        '200':
          description: 'The export, with the document link when sent'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportArtifactResponse' }

  /content/{artifactId}/revise-slide:
    post:
      operationId: revise_slide
      tags: [Content]
      summary: Revise one slide of an existing deck from a prompt
      description: |
        RPC-backed. `slide_index` is zero-based. Returns as soon as the
        revision is accepted; poll `GET /content` for the finished deck.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                slide_index: { type: integer, minimum: 0 }
                prompt: { type: string }
              required: [slide_index, prompt]
      responses:
        '200':
          description: "The deck's status after the revision"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviseSlideResponse' }
        '400': { description: Missing slide_index or prompt }

  /notebooks/{id}/labels:
    get:
      operationId: list_labels
      tags: [Notebooks]
      summary: List a notebook's source labels
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Label list'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListLabelsResponse' }
    post:
      operationId: manage_labels
      tags: [Notebooks]
      summary: Create or delete source labels
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [list, create, delete] }
                name: { type: string }
                emoji: { type: string }
                label_ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: 'Labels after the change'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManageLabelsResponse' }

  /content/study-aid:
    post:
      operationId: generate_study_aid
      tags: [Content]
      summary: Generate a study aid (flashcards or quiz)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                kind: { type: string, enum: [flashcards, quiz] }
                focus: { type: string }
              required: [kind]
      responses:
        '200':
          description: 'Generation result'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateStudyAidResponse' }

  /content/mind-map:
    post:
      operationId: generate_mind_map
      tags: [Content]
      summary: Generate and save a mind map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                title: { type: string }
      responses:
        '200':
          description: 'Generation result'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateMindMapResponse' }

  /content/research:
    post:
      operationId: research_sources
      tags: [Content]
      summary: Discover web sources for a notebook (Fast Research), optionally importing them
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                query: { type: string }
                import: { type: boolean }
              required: [query]
      responses:
        '200':
          description: 'Discovered sources'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchSourcesResponse' }

  /content/generate:
    post:
      operationId: generate_content
      tags: [Content]
      summary: Generate Studio content (audio, video, infographic, report, presentation, data table)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: 'Generated artifact metadata'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateContentResponse' }

  /content/download:
    get:
      operationId: download_content
      tags: [Content]
      summary: Download a generated artifact (WAV, MP4, PNG)
      parameters:
        - in: query
          name: content_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Binary file'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadContentResponse' }

  /content:
    get:
      operationId: list_content
      tags: [Content]
      summary: List sources and generated content for the active notebook
      responses:
        '200':
          description: 'Content list'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListContentResponse' }

  /content/notes:
    post:
      operationId: create_note
      tags: [Content]
      summary: Create a note in the active notebook
      responses:
        '200':
          description: 'Note created'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateNoteResponse' }

  /content/chat-to-note:
    post:
      operationId: save_chat_to_note
      tags: [Content]
      summary: Save the current chat discussion as a note
      responses:
        '200':
          description: 'Note saved'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveChatToNoteResponse' }

  /content/notes/{noteTitle}/to-source:
    post:
      operationId: convert_note_to_source
      tags: [Content]
      summary: Convert a note into a NotebookLM source
      parameters:
        - in: path
          name: noteTitle
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Note converted to source'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConvertNoteToSourceResponse' }

  /batch-to-vault:
    post:
      operationId: batch_to_vault
      tags: [Q&A]
      summary: Run a batch of questions and write each answer to a vault directory
      description: |
        Long-running: one NotebookLM answer per question, written as a markdown
        file conforming to the `nblm-answer-v1` schema. Size the client timeout
        accordingly (and the reverse-proxy read timeout, if any).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questions: { type: array, items: { type: string } }
                notebook_id: { type: string }
                notebook_url: { type: string }
                vault_dir: { type: string }
                slug_prefix: { type: string }
                source_format: { type: string, enum: [none, inline, footnotes, json, expanded] }
                sleep_between_ms: { type: integer }
                session_id: { type: string }
              required: [questions]
      responses:
        '200':
          description: 'Batch result, one entry per question'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchToVaultResponse' }

  /content/notes/list:
    post:
      operationId: list_notes
      tags: [Content]
      summary: List the notebook's notes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_url: { type: string }
                session_id: { type: string }
      responses:
        '200':
          description: 'Note list'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListNotesResponse' }

  /content/notes/get:
    post:
      operationId: get_note
      tags: [Content]
      summary: Read one note's content, by title or id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note_title: { type: string }
                note_id: { type: string }
                notebook_url: { type: string }
                session_id: { type: string }
      responses:
        '200':
          description: 'Note content'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetNoteResponse' }
        '400': { description: Neither note_title nor note_id was given }

  /cleanup-data:
    post:
      operationId: cleanup_data
      tags: [Auth]
      summary: Wipe all local data (requires confirmation)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean }
      responses:
        '200':
          description: 'Cleaned'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupDataResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Value of NOTEBOOKLM_API_KEY, also accepted as the X-API-Key header.
  schemas:
    ServerInfo:
      description: >-
        The root route is not wrapped in the success envelope: it is the
        server's own banner, and it lists every other route.
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        docs: { type: string }
        endpoints:
          type: object
          additionalProperties: { type: string }

    UtcpManual:
      description: >-
        A UTCP manual, whose shape belongs to the client's own model rather
        than to this server. Every url is rebased onto the address the
        request arrived at.
      type: object
      properties:
        utcp_version: { type: string }
        manual_version: { type: string }
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              inputs: { type: object }
              outputs: { type: object }
              tool_call_template:
                type: object
                properties:
                  call_template_type: { type: string }
                  http_method: { type: string }
                  url: { type: string }
                  content_type: { type: string }
                  body_field: { type: string }
                  auth:
                    type: object
                    properties:
                      auth_type: { type: string }
                      api_key: { type: string }
                      var_name: { type: string }
                      location: { type: string }

    GetHealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            authenticated:
              type: boolean
            notebook_url:
              type: string
            active_sessions:
              type: integer
            max_sessions:
              type: integer
            session_timeout:
              type: integer
            total_messages:
              type: integer
            headless:
