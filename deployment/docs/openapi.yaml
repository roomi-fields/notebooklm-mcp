openapi: 3.1.0
info:
  title: NotebookLM REST API
  version: 4.4.0
  description: |
    Local HTTP REST API for Google NotebookLM. Citation-backed Q&A, Studio
    content generation (audio, video, infographic, report, presentation,
    data table), notebook library management, multi-account auto-reauth.

    Companion to the MCP server in the same package
    (`@roomi-fields/notebooklm-mcp`). See
    https://notebooklm.roomi-fields.com/ for the full guide.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Romain Peyrichou
    url: https://github.com/roomi-fields/notebooklm-mcp

servers:
  - url: http://localhost:3000
    description: Local server (default)
  - url: http://{host}:{port}
    description: Custom host
    variables:
      host:
        default: localhost
      port:
        default: '3000'

# Required once the server runs with NOTEBOOKLM_API_KEY (mandatory for any
# bind wider than loopback). /health is the only route that answers without it,
# and then returns liveness only. See GHSA-p69m-c5rf-g2c3.
security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Q&A
  - name: Notebooks
  - name: Sources
  - name: Content
  - name: Sessions

paths:
  /:
    get:
      tags: [Health]
      summary: Server identity, version, and a pointer to the docs
      responses:
        '200': { description: Server descriptor }

  /health:
    get:
      tags: [Health]
      summary: Server health check
      responses:
        '200':
          description: Server status, uptime, active sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /setup-auth:
    post:
      tags: [Auth]
      summary: First-time Google authentication (opens visible browser)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                show_browser: { type: boolean, default: true }
                account: { type: string }
      responses:
        '200':
          description: Auth completed
          content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } }

  /de-auth:
    post:
      tags: [Auth]
      summary: Logout, clear all credentials
      responses:
        '200':
          description: Logged out
          content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } }

  /re-auth:
    post:
      tags: [Auth]
      summary: Re-authenticate or switch account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account: { type: string }
      responses:
        '200':
          description: Re-authenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } }

  /ask:
    post:
      tags: [Q&A]
      summary: Ask a question with citation-backed response
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '200':
          description: Answer with citations
          content: { application/json: { schema: { $ref: '#/components/schemas/AskResponse' } } }
        '400':
          description: Missing question
        '500':
          description: Server error

  /notebooks:
    get:
      tags: [Notebooks]
      summary: List all notebooks in the local library
      responses:
        '200': { description: Notebook list }
    post:
      tags: [Notebooks]
      summary: Manually add a notebook to the library
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, name, url]
              properties:
                id: { type: string }
                name: { type: string }
                url: { type: string }
                description: { type: string }
                topics: { type: array, items: { type: string } }
      responses:
        '200': { description: Notebook added }

  /notebooks/scrape:
    get:
      tags: [Notebooks]
      summary: Scrape all notebooks from NotebookLM UI
      responses:
        '200': { description: Live notebook list with ids and names }

  /notebooks/import-from-scrape:
    post:
      tags: [Notebooks]
      summary: Bulk import scraped notebooks into local library
      responses:
        '200': { description: Import summary }

  /notebooks/auto-discover:
    post:
      tags: [Notebooks]
      summary: Generate notebook metadata autonomously via NotebookLM queries
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
      responses:
        '200': { description: Generated metadata }

  /notebooks/search:
    get:
      tags: [Notebooks]
      summary: Search the local library by keyword
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200': { description: Matching notebooks }

  /notebooks/stats:
    get:
      tags: [Notebooks]
      summary: Library statistics
      responses:
        '200': { description: Counts and aggregates }

  /notebooks/bulk-delete:
    delete:
      tags: [Notebooks]
      summary: Delete multiple notebooks at once
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200': { description: Deletion summary }

  /notebooks/{id}:
    get:
      tags: [Notebooks]
      summary: Get notebook details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Notebook details }
    put:
      tags: [Notebooks]
      summary: Update notebook metadata
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Notebooks]
      summary: Delete a notebook from the library
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }

  /notebooks/{id}/activate:
    put:
      tags: [Notebooks]
      summary: Set notebook as the default active notebook
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Activated }

  /notebooks/create:
    post:
      tags: [Notebooks]
      summary: Create a new notebook in NotebookLM
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Created notebook }

  /sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      responses:
        '200': { description: Active sessions }

  /sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Close a session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Closed }

  /sessions/{id}/reset:
    post:
      tags: [Sessions]
      summary: Reset a session's history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reset }

  /content/sources:
    post:
      tags: [Sources]
      summary: Add a source (file, url, text, youtube, drive) to the active notebook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddSourceRequest' }
      responses:
        '200': { description: Source added }
    delete:
      tags: [Sources]
      summary: Delete source by name (query parameter)
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }

  /content/sources/{id}:
    delete:
      tags: [Sources]
      summary: Delete source by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }

  /content/{contentId}:
    delete:
      tags: [Content]
      summary: Delete a generated Studio artifact
      description: |
        RPC-backed (no browser). Irreversible. Note-backed mind maps are not
        covered — they live in the notes system, not the Studio library.
      parameters:
        - in: path
          name: contentId
          required: true
          schema: { type: string }
        - in: query
          name: notebook_url
          required: false
          schema: { type: string }
        - in: query
          name: notebook_id
          required: false
          schema: { type: string }
      responses:
        '200': { description: Deleted }

  /notebooks/{id}/sources:
    get:
      tags: [Sources]
      summary: List a notebook's sources with their ids and titles
      description: |
        RPC-backed (no browser). Returns `{ notebookId, count, sources: [{ id, title }] }`.
        This is where the source ids for `/notebooks/{id}/sources/{sourceId}` come from.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Source list }

  /notebooks/{id}/sources/{sourceId}:
    get:
      tags: [Sources]
      summary: Read a source's indexed text, one page at a time
      description: |
        RPC-backed (no browser). Returns the exact content NotebookLM reasons
        over. Sources are long — the first PDF measured ran to 157,716
        characters — so the response is paginated by default and carries
        `totalChars`, `pageChars`, `offset`, `hasMore`, `nextCursor` and a
        plain-language `continue` instruction. Pages are cut at the nearest
        line break (tag close, in HTML), and concatenating every page
        reproduces the document exactly. Pass `paginate=false` for the whole
        document in one response. The `html` rendition preserves structure but
        inlines images as base64 and is bigger.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: sourceId
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [text, html], default: text }
        - in: query
          name: paginate
          required: false
          description: Set to `false` to return the whole document in one response.
          schema: { type: boolean, default: true }
        - in: query
          name: max_chars
          required: false
          description: Page size in characters. Ignored when `paginate=false`.
          schema: { type: integer, default: 20000, minimum: 1 }
        - in: query
          name: cursor
          required: false
          description: Resume point — the `nextCursor` returned by the previous page.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: One page of the source's content, plus how to fetch the rest

    patch:
      tags: [Sources]
      summary: Rename one source in place
      description: RPC-backed (no browser). An empty `title` is a 400.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: sourceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
              required: [title]
      responses:
        '200': { description: The source's new title }
        '400': { description: Missing or empty title }

  /notebooks/{id}/sources/{sourceId}/guide:
    get:
      tags: [Sources]
      summary: NotebookLM's own summary and key topics for one source
      description: |
        RPC-backed (no browser). A source NotebookLM has not summarised yet
        returns an empty `summary` and no topics.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: sourceId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Summary and key topics }

  /notebooks/{id}/search:
    post:
      tags: [Notebooks]
      summary: Ranked passages from the notebook's index, without generating an answer
      description: |
        RPC-backed (no browser). Retrieval rather than question answering:
        nothing is generated and no generation quota is spent. Rank is global
        across sources and lower is better. `start` / `end` are character
        offsets into the source's full text, and are `null` when the server
        did not give them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                source_ids:
                  type: array
                  items: { type: string }
                  description: Restrict to these source UUIDs. Omit to search them all.
                source_names:
                  type: array
                  items: { type: string }
                  description: Restrict by source title; an ambiguous title is an error.
                limit:
                  type: number
                  description: Keep at most this many passages, best rank first.
      responses:
        '200': { description: Ranked passages }

  /notebooks/{id}/summary:
    get:
      tags: [Notebooks]
      summary: A notebook's own summary of its sources, and the questions it suggests
      description: |
        RPC-backed (no browser). Cheaper than asking a question to find out
        what a notebook holds.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Summary and suggested topics }

  /notebooks/{id}/freshness:
    get:
      tags: [Sources]
      summary: Have the notebook's URL / Drive sources drifted?
      description: |
        RPC-backed (no browser). Checks every source unless `source_id`
        narrows it. `stale: null` means the server did not answer for that
        source — not that it is current.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: source_id
          required: false
          schema: { type: string }
      responses:
        '200': { description: Per-source freshness }

  /notebooks/{id}/chat:
    get:
      tags: [Notebooks]
      summary: Read back the recorded questions and answers, newest first
      description: |
        RPC-backed (no browser). NotebookLM exposes only the most recent
        conversation per notebook; older ones cannot be listed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: conversation_id
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
      responses:
        '200': { description: Conversation turns }
    delete:
      tags: [Notebooks]
      summary: Clear the chat history
      description: |
        The web UI's "Delete history". NotebookLM has no per-turn delete, so
        the whole conversation goes. Nothing to delete is reported as
        `deleted: false`, not as a failure.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: conversation_id
          required: false
          schema: { type: string }
      responses:
        '200': { description: What was deleted }

  /notebooks/{id}/share:
    get:
      tags: [Notebooks]
      summary: Read a notebook's sharing status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Sharing status }
    put:
      tags: [Notebooks]
      summary: Toggle the public link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public: { type: boolean }
              required: [public]
      responses:
        '200': { description: Sharing status after the change }

  /content/{artifactId}/export:
    post:
      tags: [Content]
      summary: Export a finished artifact to Google Docs or Sheets
      description: |
        RPC-backed. `documentUrl` is `null` when the reply carried no Drive
        link — the export may still have succeeded; check Drive.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                target: { type: string, enum: [docs, sheets], default: docs }
                title: { type: string, default: Export }
      responses:
        '200': { description: The export, with the document link when sent }

  /content/{artifactId}/revise-slide:
    post:
      tags: [Content]
      summary: Revise one slide of an existing deck from a prompt
      description: |
        RPC-backed. `slide_index` is zero-based. Returns as soon as the
        revision is accepted; poll `GET /content` for the finished deck.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                slide_index: { type: integer, minimum: 0 }
                prompt: { type: string }
              required: [slide_index, prompt]
      responses:
        '200': { description: The deck's status after the revision }
        '400': { description: Missing slide_index or prompt }

  /notebooks/{id}/labels:
    get:
      tags: [Notebooks]
      summary: List a notebook's source labels
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Label list }
    post:
      tags: [Notebooks]
      summary: Create or delete source labels
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [list, create, delete] }
                name: { type: string }
                emoji: { type: string }
                label_ids: { type: array, items: { type: string } }
      responses:
        '200': { description: Labels after the change }

  /content/study-aid:
    post:
      tags: [Content]
      summary: Generate a study aid (flashcards or quiz)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                kind: { type: string, enum: [flashcards, quiz] }
                focus: { type: string }
              required: [kind]
      responses:
        '200': { description: Generation result }

  /content/mind-map:
    post:
      tags: [Content]
      summary: Generate and save a mind map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                title: { type: string }
      responses:
        '200': { description: Generation result }

  /content/research:
    post:
      tags: [Content]
      summary: Discover web sources for a notebook (Fast Research), optionally importing them
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_id: { type: string }
                notebook_url: { type: string }
                query: { type: string }
                import: { type: boolean }
              required: [query]
      responses:
        '200': { description: Discovered sources }

  /content/generate:
    post:
      tags: [Content]
      summary: Generate Studio content (audio, video, infographic, report, presentation, data table)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200': { description: Generated artifact metadata }

  /content/download:
    get:
      tags: [Content]
      summary: Download a generated artifact (WAV, MP4, PNG)
      parameters:
        - in: query
          name: content_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Binary file }

  /content:
    get:
      tags: [Content]
      summary: List sources and generated content for the active notebook
      responses:
        '200': { description: Content list }

  /content/notes:
    post:
      tags: [Content]
      summary: Create a note in the active notebook
      responses:
        '200': { description: Note created }

  /content/chat-to-note:
    post:
      tags: [Content]
      summary: Save the current chat discussion as a note
      responses:
        '200': { description: Note saved }

  /content/notes/{noteTitle}/to-source:
    post:
      tags: [Content]
      summary: Convert a note into a NotebookLM source
      parameters:
        - in: path
          name: noteTitle
          required: true
          schema: { type: string }
      responses:
        '200': { description: Note converted to source }

  /batch-to-vault:
    post:
      tags: [Q&A]
      summary: Run a batch of questions and write each answer to a vault directory
      description: |
        Long-running: one NotebookLM answer per question, written as a markdown
        file conforming to the `nblm-answer-v1` schema. Size the client timeout
        accordingly (and the reverse-proxy read timeout, if any).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questions: { type: array, items: { type: string } }
                notebook_id: { type: string }
                notebook_url: { type: string }
                vault_dir: { type: string }
                slug_prefix: { type: string }
                source_format: { type: string, enum: [none, inline, footnotes, json, expanded] }
                sleep_between_ms: { type: integer }
                session_id: { type: string }
              required: [questions]
      responses:
        '200': { description: Batch result, one entry per question }

  /content/notes/list:
    post:
      tags: [Content]
      summary: List the notebook's notes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notebook_url: { type: string }
                session_id: { type: string }
      responses:
        '200': { description: Note list }

  /content/notes/get:
    post:
      tags: [Content]
      summary: Read one note's content, by title or id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note_title: { type: string }
                note_id: { type: string }
                notebook_url: { type: string }
                session_id: { type: string }
      responses:
        '200': { description: Note content }
        '400': { description: Neither note_title nor note_id was given }

  /cleanup-data:
    post:
      tags: [Auth]
      summary: Wipe all local data (requires confirmation)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean }
      responses:
        '200': { description: Cleaned }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Value of NOTEBOOKLM_API_KEY, also accepted as the X-API-Key header.
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        uptime_s: { type: number }
        active_sessions: { type: integer }
        version: { type: string, example: 1.5.9 }

    Result:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        error: { type: string }

    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          example: 'Summarize chapter 3'
        notebook_id:
          type: string
        notebook_url:
          type: string
        session_id:
          type: string
        source_format:
          type: string
          enum: [none, inline, footnotes, json, expanded]
          default: json
        show_browser:
          type: boolean
          default: false

    AskResponse:
      type: object
      properties:
        success: { type: boolean }
        answer: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              source: { type: string }
              excerpt: { type: string }
        session_id: { type: string }

    AddSourceRequest:
      type: object
      required: [source_type]
      properties:
        source_type:
          type: string
          enum: [file, url, text, youtube, drive]
        file_path: { type: string }
        url: { type: string }
        text: { type: string }
        title: { type: string }
        notebook_url: { type: string }
        session_id: { type: string }

    GenerateRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          enum:
            - audio_overview
            - video
            - infographic
            - report
            - presentation
            - data_table
        language: { type: string, example: en }
