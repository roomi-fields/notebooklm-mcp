[package]
name = "notebooklm"
version = "4.8.0"
edition = "2021"
# Verified by building with it, not asserted: 1.82 and 1.85 both fail on the
# internationalisation crates the HTTP client pulls in, which require 1.88.
rust-version = "1.88"
description = "Async Rust client for the local Gemini Notebook (NotebookLM) REST API: citation-backed answers, passage search, and the UTCP manual."
documentation = "https://docs.rs/notebooklm"
homepage = "https://notebooklm.roomi-fields.com/"
repository = "https://github.com/roomi-fields/notebooklm-mcp"
license = "MIT"
readme = "README.md"
keywords = ["notebooklm", "gemini", "rest", "client", "utcp"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["rustls"]
# The platform's own TLS stack instead of the bundled one.
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls"]
# A synchronous façade over the same calls, for programs with no runtime.
blocking = ["dep:tokio"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
