name: Release

on:
  push:
    tags:
      - 'v*'
  # npm can hold a publish in a staging queue for over an hour, which is longer
  # than any wait this job can justify, and a republish then fails 409 rather
  # than succeeding. So the registry half must be startable on its own, against
  # a version npm is already serving.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already on npm to register (e.g. 4.6.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 for npm >= 11.5.1, which is what speaks OIDC to the registry.
      # Node 20 ships npm 10 and would silently fall back to looking for a
      # token that no longer exists.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync (plugin manifest, docs, README)
        run: |
          npm run version:check
          npm run facts:check
          npm run utcp:check

      - name: Build
        run: npm run build

      # Trusted publishing: the runner proves its identity to npm with a
      # short-lived OIDC token (id-token: write, granted above), so there is no
      # NPM_TOKEN to store, leak or rotate. The stored Automation token this
      # replaces expired twice — silently, and each time the failure surfaced as
      # a misleading `404 Not Found` on PUT, which is what npm returns for an
      # unauthenticated write so as not to reveal whether the package exists.
      - name: Publish to npm (OIDC trusted publishing, no token)
        run: npm publish --access public

      - name: Extract changelog section for this release
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Pull the section between "## [VERSION]" and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          # Strip leading "---" separator and surrounding blank lines if present.
          sed -i -E '1{/^[[:space:]]*$/d}; ${/^[[:space:]]*---[[:space:]]*$/d}' "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**Install / upgrade:** \`npm i -g @roomi-fields/notebooklm-mcp@$VERSION\`"
              echo ""
              echo "**Full changelog:** https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
            } >> "$NOTES_FILE"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "Extracted $(wc -l < "$NOTES_FILE") lines of notes for $VERSION"
          else
            echo "No CHANGELOG section found for [$VERSION]; will use auto-generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (with CHANGELOG notes)
        if: steps.changelog.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --verify-tag

      - name: Create GitHub Release (auto-generated fallback)
        if: steps.changelog.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  # Publish the Rust client to crates.io. Trusted publishing: the runner proves
  # its identity with the OIDC token this workflow already grants, exchanges it
  # for a thirty-minute access token, and no secret is stored anywhere.
  #
  # The first version of a crate cannot be published this way — crates.io only
  # accepts a trusted-publisher configuration for a crate that already exists,
  # so the first release needs one disposable scoped token. Exactly the same
  # bootstrap npm requires, and for the same reason.
  publish-crate:
    name: Publish the Rust client to crates.io
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal

      # The crate version is kept equal to the server version by version:sync,
      # and version:check in `release` has already failed the release if it
      # drifted. This is the second half of that check: the tag must match too.
      - name: Verify the crate carries the tagged version
        working-directory: crates/notebooklm-client
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::the tag says ${TAG} and the crate says ${CRATE}"
            exit 1
          fi
          echo "crate and tag agree on ${TAG}"

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        working-directory: crates/notebooklm-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  # Publish server.json to the official MCP Registry. Separate job so a registry
  # hiccup can be re-run alone without re-attempting the npm publish, and gated
  # on `release` so npm ships first. Auth is GitHub Actions OIDC (id-token:
  # write, already granted above) — no stored token. server.json is kept at the
  # released version by version:sync and enforced by version:check in `release`.
  publish-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      # npm accepts a publish before the version is readable from the registry,
      # and the MCP registry validates against that read. The gap is a minute
      # or two, and it failed this job on 3.2.0, 4.0.0 and 4.1.0 — each time
      # needing a manual re-run of a release that had actually succeeded.
      - name: Wait for npm to serve the new version
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || '' }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 90); do
            if [ "$(npm view "@roomi-fields/notebooklm-mcp@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              echo "npm is serving ${VERSION} (after ${attempt} attempt(s))"
              exit 0
            fi
            echo "attempt ${attempt}: ${VERSION} not on npm yet, waiting 20s"
            sleep 20
          done
          echo "::error::npm has not served ${VERSION} in 30 minutes. It accepted           the publish — the tarball sits in its staging queue, which has taken over           an hour. Nothing is lost and a republish would fail 409: wait for the           version to appear, then re-run this workflow from the Actions tab with           that version as input."
          exit 1

      - name: Publish server.json (GitHub OIDC auth)
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
