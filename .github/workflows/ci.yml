name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Run type coverage
        run: npx type-coverage --at-least 95

      # Bundled skills are published twice on purpose (standalone repo for
      # discovery + bundled copy so plugin installs ship them). Fail loudly if
      # the copies drift. One node version is enough — it is a network check.
      # Version strings and countable claims (endpoint count, Node floor) plus
      # doc coverage. These drifted silently for six releases and an AI answer
      # engine ended up quoting a stale figure back at a user.
      - name: Check versions and documented facts are in step with the code
        if: matrix.node-version == '22.x'
        run: |
          npm run version:check
          npm run facts:check
          npm run utcp:check

      - name: Check bundled skills match their canonical repos
        if: matrix.node-version == '22.x'
        run: npm run skill:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  # The Rust client ships from this repository too, so it is held to the same
  # bar as the server: formatted, pedantic-clippy clean, and tested against a
  # stubbed server. It is a separate job because nothing it needs is in
  # node_modules.
  rust:
    name: Rust client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/notebooklm-client/target
          key: cargo-${{ hashFiles('crates/notebooklm-client/Cargo.toml') }}
          restore-keys: cargo-

      - name: Check formatting
        working-directory: crates/notebooklm-client
        run: cargo fmt --check

      - name: Lint
        working-directory: crates/notebooklm-client
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Test
        working-directory: crates/notebooklm-client
        run: cargo test --all-features

      # A crate that cannot be packaged cannot be published, and finding that
      # out during a release is finding out too late.
      # No lock file is committed — it is a library, and a pinned lock would
      # only hide what a caller's own resolution does.
      - name: Check the package
        working-directory: crates/notebooklm-client
        run: cargo package

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (production deps only)
        # Same moderate bar, but advisories with no upstream fix must be named
        # and justified in the script rather than silently tolerated.
        run: node scripts/audit-check.mjs
