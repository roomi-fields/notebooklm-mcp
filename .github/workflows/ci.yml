name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Run type coverage
        run: npx type-coverage --at-least 95

      # The published specification is what an AI client fetches and what a
      # code generator reads. Ours was invalid for months and nothing noticed:
      # three response descriptions contained an unquoted comma inside a flow
      # mapping, so YAML split them into a second, meaningless key and every
      # generator refused the document outright. Our own guards only ever
      # counted routes.
      - name: Validate the OpenAPI specification
        run: npx --yes @redocly/cli@1.34.3 lint deployment/docs/openapi.yaml --format=stylish

      # Bundled skills are published twice on purpose (standalone repo for
      # discovery + bundled copy so plugin installs ship them). Fail loudly if
      # the copies drift. One node version is enough — it is a network check.
      # Version strings and countable claims (endpoint count, Node floor) plus
      # doc coverage. These drifted silently for six releases and an AI answer
      # engine ended up quoting a stale figure back at a user.
      - name: Check versions and documented facts are in step with the code
        if: matrix.node-version == '22.x'
        run: |
          npm run version:check
          npm run facts:check
          npm run utcp:check

      - name: Check bundled skills match their canonical repos
        if: matrix.node-version == '22.x'
        run: npm run skill:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  # The Rust client ships from this repository too, so it is held to the same
  # bar as the server: formatted, pedantic-clippy clean, and tested against a
  # stubbed server. It is a separate job because nothing it needs is in
  # node_modules.
  rust:
    name: Rust client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/notebooklm-client/target
          key: cargo-${{ hashFiles('crates/notebooklm-client/Cargo.toml') }}
          restore-keys: cargo-

      # The typed surface is generated from the specification. A hand edit
      # would be silently overwritten on the next release, so it fails here
      # instead.
      - name: Check the client matches the specification
        run: npm ci --ignore-scripts && npm run rust:check

      - name: Check formatting
        working-directory: crates/notebooklm-client
        run: cargo fmt --check

      - name: Lint
        working-directory: crates/notebooklm-client
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Test
        working-directory: crates/notebooklm-client
        run: cargo test --all-features

      # A crate that cannot be packaged cannot be published, and finding that
      # out during a release is finding out too late.
      # No lock file is committed — it is a library, and a pinned lock would
      # only hide what a caller's own resolution does.
      - name: Check the package
        working-directory: crates/notebooklm-client
        run: cargo package

  # The Ruby gem ships from this repository too, and is held to the same bar:
  # its surface matches the specification, and it is tested against a stub
  # server built out of the standard library — the gem has no runtime
  # dependencies and its tests have none either.
  ruby:
    name: Ruby client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # The surface is generated from the specification. A hand edit would be
      # silently overwritten on the next release, so it fails here instead.
      - name: Check the client matches the specification
        run: npm ci --ignore-scripts && npm run ruby:check

      - name: Test
        working-directory: gems/notebooklm
        run: rake test

      # A gem that cannot be built cannot be published, and finding that out
      # during a release is finding out too late.
      - name: Check the package
        working-directory: gems/notebooklm
        run: gem build notebooklm.gemspec

  # The n8n community node ships from this repository too. n8n's verification
  # rules are strict about the package — the `n8n-community-node-package`
  # keyword, no runtime dependency, one service per package — so the package is
  # checked here rather than at submission time.
  n8n:
    name: n8n community node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The node's surface is generated from the specification. A hand edit
      # would be silently overwritten on the next release, so it fails here
      # instead.
      - name: Check the node matches the specification
        run: npm ci --ignore-scripts && npm run n8n:check

      - name: Build
        working-directory: nodes/n8n-nodes-gemini-notebook
        run: npm install && npm run build

      # A node n8n cannot load is a node nobody can install, and finding that
      # out during a release is finding out too late.
      - name: Check the package n8n will load
        working-directory: nodes/n8n-nodes-gemini-notebook
        run: |
          set -euo pipefail
          node -e "
            const assert = require('node:assert');
            const pkg = require('./package.json');
            assert(pkg.keywords.includes('n8n-community-node-package'), 'the community keyword is required');
            assert(pkg.name.startsWith('n8n-nodes-'), 'the package name must start with n8n-nodes-');
            assert(pkg.n8n.n8nNodesApiVersion === 1, 'n8nNodesApiVersion must be 1');
            assert(!pkg.dependencies, 'a verified node carries no runtime dependency');
            for (const f of [...pkg.n8n.nodes, ...pkg.n8n.credentials]) require('fs').accessSync(f);
            const { NotebookLm } = require('./dist/nodes/NotebookLm/NotebookLm.node.js');
            const node = new NotebookLm();
            const ops = node.description.properties.filter((p) => p.name === 'operation');
            const total = ops.reduce((n, p) => n + p.options.length, 0);
            assert.equal(total, 59, 'expected 59 operations, found ' + total);
            console.log('the node declares ' + total + ' operations across ' + ops.length + ' resources');
          "

      - name: Pack
        working-directory: nodes/n8n-nodes-gemini-notebook
        run: npm pack --dry-run

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit (production deps only)
        # Same moderate bar, but advisories with no upstream fix must be named
        # and justified in the script rather than silently tolerated.
        run: node scripts/audit-check.mjs
